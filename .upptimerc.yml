owner: b-lack
repo: schrat-status

# Every check runs from GitHub's servers, outside our own infrastructure.
sites:
  - name: Website
    url: https://schrat.eco
  - name: Web-App
    url: https://app.schrat.eco
  - name: Anmeldung
    # GoTrue behind Kong; without the (public) anon key Kong answers 401
    # even when auth is down, so the check sends it from a repo secret.
    url: https://db.schrat.eco/auth/v1/health
    headers:
      - "apikey: $SUPABASE_ANON_KEY"
  - name: Datenbank-API
    # Reads one public marketplace tag: Kong -> PostgREST -> Postgres. The
    # API root is 403 for anon, and PostgREST's default schema is not public.
    url: https://db.schrat.eco/rest/v1/schema_tags?select=id&limit=1
    headers:
      - "apikey: $SUPABASE_ANON_KEY"
      - "Accept-Profile: public"
  - name: Synchronisation
    url: https://sync.schrat.eco/probes/readiness
  - name: E-Mail-Richtlinie
    url: https://mta-sts.schrat.eco/.well-known/mta-sts.txt

# Downtime opens a GitHub issue assigned here; GitHub e-mails the assignee.
assignees:
  - b-lack

status-website:
  cname: status.schrat.eco
  logoUrl: https://schrat.eco/favicon.png
  favicon: https://schrat.eco/favicon.png
  name: Schrat Status
  introTitle: "**Schrat** – aktueller Betriebsstatus"
  introMessage: "Verfügbarkeit von Website, Web-App, Anmeldung und Synchronisation, alle 5 Minuten von außen geprüft. Die Apps arbeiten offline weiter; Erfasstes wird übertragen, sobald der Dienst wieder erreichbar ist. Sicherheit und Datenschutz: [schrat.eco/sicherheit](https://schrat.eco/sicherheit)"
  navbar:
    - title: Status
      href: /
    - title: Schrat
      href: https://schrat.eco
    - title: Sicherheit
      href: https://schrat.eco/sicherheit

